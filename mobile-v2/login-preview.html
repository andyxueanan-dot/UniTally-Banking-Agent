<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FinPilot · 团队体验（新版登录页预览稿）</title>
<!--
  预览稿：对应 backend/team-share-server.js 里的 loginPage() 模板。
  审核通过后，把 <main> 的结构与 <style> 搬进 loginPage()，并保留原模板里的两个占位：
    ${failed ? '<p role="alert" class="warn">口令不正确，请重新输入。</p>' : ''}
    每日最多 ${maxDailyCalls} 次 AI 调用
  表单字段（action=/team/login、name=password）与原版完全一致，后端无需改动。
-->
<style>
  :root { --ink: #1a1a18; --ink-2: #4c4c47; --ink-3: #7c7c75; --rule: #e6e6e1; --rule-2: #c8c8c1; --accent: #1d5c3f; --red: #a8321f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; flex-direction: column; }
  main { width: 100%; max-width: 420px; margin: auto; padding: 48px 24px 40px; }
  .wordmark { font: 500 30px/1.1 "Palatino Linotype", "Book Antiqua", Palatino, Georgia, "Noto Serif", "Songti SC", serif; letter-spacing: -0.3px; }
  .kicker { display: block; font-size: 12px; color: var(--ink-3); letter-spacing: 0.6px; margin-top: 8px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.2px; margin: 36px 0 10px; }
  p { margin: 0; color: var(--ink-2); line-height: 1.7; }
  form { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--rule); }
  label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  input { width: 100%; min-height: 48px; padding: 11px 14px; border: 1px solid var(--rule-2); border-radius: 2px; font: inherit; font-size: 16px; color: var(--ink); background: #fff; }
  input:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
  button { width: 100%; min-height: 48px; margin-top: 14px; border: 1px solid var(--ink); border-radius: 2px; background: var(--ink); color: #fff; font: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.2px; cursor: pointer; }
  button:hover { background: #000; }
  .warn { border-left: 2px solid var(--red); padding: 6px 0 6px 12px; color: var(--ink); margin: 16px 0 0; }
  .note { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); }
  .note b { color: var(--ink-2); font-weight: 600; }
  footer { padding: 16px 24px calc(16px + env(safe-area-inset-bottom)); font-size: 12px; color: var(--ink-3); text-align: center; }
</style>
<main>
  <div class="wordmark">FinPilot</div>
  <small class="kicker">团队体验 · 比赛原型 · 仅模拟资金</small>
  <h1>欢迎来体验</h1>
  <p>请输入组长提供的团队口令。这里的账户、资金、产品和订单全部是模拟数据；请勿填写真实银行卡号、身份证或密码。</p>
  <!-- ${failed ? '<p role="alert" class="warn">口令不正确，请重新输入。</p>' : ''} -->
  <form action="/team/login" method="post">
    <label for="password">团队访问口令</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button>进入演示</button>
  </form>
  <p class="note"><b>关于 AI 调用</b>：AI 对话会发送给后端配置的模型供应商，团队每日合计最多 20 次；页面内验证码不是短信验证。固定云端地址，免费服务空闲后可能休眠，再次打开需等待唤醒。</p>
</main>
<footer>FinPilot Banking Lab · 国内赛题原型 · 非真实金融服务</footer>
</html>
